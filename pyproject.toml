[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeymoon"
version = "5.0.0"
description = "HONEYMOON — The Hive Mind Dev Engine."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Adjective LLC"}
]
keywords = ["agents", "llm", "security", "code-audit", "red-team", "mcp", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "litellm>=1.82.0",
    "pydantic>=2.12.5",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.3",
    "gitpython>=3.1.46",
    "httpx>=0.28.1",
    "tenacity>=8.2.0",
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",
    "PyNaCl>=1.5.0",
    "mcp>=1.2.0,<2",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/adjective-rob/honeymoon"
Repository = "https://github.com/adjective-rob/honeymoon"
Issues = "https://github.com/adjective-rob/honeymoon/issues"
Changelog = "https://github.com/adjective-rob/honeymoon/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
]

ast = [
    "tree-sitter-languages>=1.10.2",
    "tree-sitter>=0.21.0,<0.22.0",
]

[project.scripts]
honeymoon = "honeymoon.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["honeymoon*"]

[tool.ruff]
target-version = "py311"
line-length = 100

# Prevent Pytest from scanning the whole repo for "test_*.py" files
[tool.pytest.ini_options]
testpaths = ["tests"]
